openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      summary: Order detail with admin-only actor names
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AdminPasscode"
      responses:
        "200":
          description: Order detail and chronological history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderDetail"
        "401":
          description: Invalid or missing passcode
        "404":
          description: Order not found
        "500":
          description: Database failure
  /admin/orders/{id}/status:
    patch:
      operationId: changeAdminOrderStatus
      summary: Change status with a self-declared shared-passcode admin name
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/AdminPasscode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusChangeInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Invalid status or missing/invalid admin name
        "401":
          description: Invalid or missing passcode
        "500":
          description: Status was not saved
        "503":
          description: Server audit encryption is not configured; status was not changed
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: emailReadiness
      tags: [health]
      summary: Startup migration and email readiness
      description: |
        Returns 503 until startup migrations succeed, including while retrying or
        after any terminal failure. Database status reports only the startup migration
        outcome, not a live connectivity probe. No SQL or error details are exposed.
        Email is optional when disabled. Invalid SITE_URL or unavailable email provider
        also returns 503 even after migrations succeed.
        Provider state is process-local evidence, not a live availability guarantee.
        Recipient/payload validation and message-specific idempotency rejections do not
        change it or clear an existing failure. Successful real sends set available.
        Authentication, access, sender/region configuration, and quota failures set
        unavailable until a real send succeeds (or the process restarts as unchecked).
        Network errors, rate limits, provider 5xx errors, unknown failures, and malformed
        responses set unavailable for 60 seconds from the latest temporary failure,
        then unchecked, not available. Temporary errors never clear a known configuration
        failure. Unchecked means no definitive current evidence, including after cooldown.
        Readiness does not block real sends. No active probe, retry, or test email is
        triggered by readiness or cooldown. /healthz remains liveness-only.
      responses:
        "200":
          description: Migrations succeeded and email disabled or ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailReadinessStatus"
        "503":
          description: Migrations pending or failed, invalid email links, or email provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailReadinessStatus"
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
    AdminPasscode:
      name: x-admin-passcode
      in: header
      required: true
      schema:
        type: string
  schemas:
    OrderStatus:
      type: string
      enum: [baru, diproses, selesai, dibatalkan]
    OrderStatusChangeInput:
      type: object
      required: [status, changed_by]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        changed_by:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed self-declared admin name, no control characters; not a verified personal account.
    AdminOrder:
      type: object
      additionalProperties: true
      required: [id, status]
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/OrderStatus"
    AdminOrderDetail:
      allOf:
        - $ref: "#/components/schemas/AdminOrder"
        - type: object
          required: [history]
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/AdminStatusHistoryEntry"
    AdminStatusHistoryEntry:
      type: object
      required: [status, changed_at]
      properties:
        status:
          $ref: "#/components/schemas/OrderStatus"
        changed_at:
          type: string
          format: date-time
        changed_by:
          type: [string, "null"]
          description: Absent or null for legacy entries and initial buyer submission.
    EmailReadinessStatus:
      type: object
      required: [status, email, database]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        database:
          type: object
          required: [migrations]
          properties:
            migrations:
              type: string
              enum: [pending, succeeded, failed]
              description: Startup migration outcome in this process; not a live database probe.
        email:
          type: object
          required: [enabled, links, provider]
          properties:
            enabled:
              type: boolean
            links:
              type: string
              enum: [valid, invalid, not_required]
            provider:
              type: string
              enum: [not_configured, unchecked, available, unavailable]
              description: |
                Process-local send evidence; not a live probe. Message/recipient rejection
                leaves this state unchanged. Temporary failures expire after 60 seconds
                to unchecked; configuration failures require a successful real send or
                process restart. Unchecked is ready but does not assert provider recovery.
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

